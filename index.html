<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090B" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Display 字体预加载在 src/main.tsx 内注入：走 Vite 资源管线才能拿到带 hash 的 woff2 地址 -->
    <!--
      站点名与描述不要在这里手写。
      __SITE_NAME__ / __SITE_DESCRIPTION__ 由 vite.config.ts 的 injectSiteMeta 插件
      在构建时从 src/content/site.ts 注入 —— 改文案只改 site.ts 一处。
    -->
    <title>__SITE_NAME__ · 个人主页</title>
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="author" content="__SITE_NAME__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_NAME__ · 个人主页" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_NAME__ · 个人主页" />
    <meta name="twitter:description" content="__SITE_DESCRIPTION__" />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
